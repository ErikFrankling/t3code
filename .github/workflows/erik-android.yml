name: Erik Android APK

# Fork-only: ships every push to erik/main to Erik's phone without a tap
# (docs/erik-updates.md). When the native fingerprint matches the installed
# APK's, the push becomes a signed JS update that the app downloads and applies
# the next time it leaves the screen. Otherwise CI builds and signs a new APK,
# and the app installs that itself. Both go through index.json on the rolling
# `android-ota` release; the APK is also published as a normal release.
#
# The release itself is scripts/erik-android-release.sh, which `t3-android-release`
# (dotfiles) also runs on the homelab when GitHub Actions is unavailable.
#
# Releases come only from erik/main, and scripts/erik-updates-guard.sh refuses
# any build that lacks a commit already shipped. Test on the emulator with
# local builds (docs/erik-updates.md), never by running this on a branch.
on:
  push:
    branches:
      - erik/main
  workflow_dispatch:
    inputs:
      apk:
        description: Build an APK even if a JS update would do
        type: boolean
        default: false
      accept_dropped_commits:
        description: Publish even though shipped commits are gone from erik/main (they were removed on purpose)
        type: boolean
        default: false

# Never cancel a run: it may be halfway through publishing. GitHub keeps only
# the newest waiting run, so a burst of pushes ends in one build of the last.
concurrency:
  group: erik-android
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    if: github.repository == 'ErikFrankling/t3code' && github.ref == 'refs/heads/erik/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # The fork carries upstream's workflows, which need upstream's runners and
      # secrets. Keep only this one enabled; new ones arrive with each rebase.
      - name: Disable upstream workflows
        run: |
          gh api "repos/$GH_REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active") | select(.path != ".github/workflows/erik-android.yml") | .id' |
            while read -r id; do gh workflow disable "$id" || true; done

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The guard compares this commit with everything already shipped.
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Release
        env:
          FORCE_APK: ${{ inputs.apk }}
          ACCEPT_DROPPED_COMMITS: ${{ inputs.accept_dropped_commits }}
          GOOGLE_SERVICES_JSON: ${{ secrets.T3CODE_ANDROID_GOOGLE_SERVICES_JSON }}
          ERIK_UPDATES_PRIVATE_KEY: ${{ secrets.ERIK_UPDATES_PRIVATE_KEY }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          T3CODE_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.T3CODE_FCM_SERVICE_ACCOUNT_JSON }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: scripts/erik-android-release.sh
