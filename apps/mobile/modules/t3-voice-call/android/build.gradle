plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.t3tools.voicecall'
version = '0.0.0'

android {
  namespace 'expo.modules.t3voicecall'
  defaultConfig {
    versionCode 1
    versionName '0.0.0'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.core:core:1.17.0'
}
